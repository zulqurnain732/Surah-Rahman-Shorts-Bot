name: YouTube Auto Upload Flow

on:
  schedule:
    # 4:30 AM PKT = 23:30 UTC | 4:30 PM PKT = 11:30 UTC
    - cron: '30 11,23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Packages
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Cookies File
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            printf "%s\n" "$YOUTUBE_COOKIES" > cookies.txt
            echo "cookies.txt ready."
          else
            touch cookies.txt
            echo "No cookies secret found, skipping."
          fi

      - name: Run Script
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          python main.py

      - name: Commit & Push Updated Tracker
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tracker.json
          git diff --staged --quiet || (git commit -m "Auto: Update tracker progress" && git push)
